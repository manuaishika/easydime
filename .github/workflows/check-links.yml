name: Check broker links (temporary)
on:
  push:
    paths: [.github/workflows/check-links.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://groww.in/ipo https://groww.in/ipo/upcoming https://zerodha.com/ipo https://zerodha.com/products/ https://console.zerodha.com/portfolio/ipo https://kite.zerodha.com/ https://zerodha.com/z-connect/kite/how-to-apply-for-ipo https://support.zerodha.com/category/trading-and-markets/ipo/ ; do
            echo "== $u"
            curl -sL -m 20 -A "Mozilla/5.0" -o /tmp/p.html -w "status=%{http_code} final=%{url_effective}\n" "$u"
            grep -io "<title>[^<]*" /tmp/p.html | head -1
          done
