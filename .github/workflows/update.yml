name: Update IPO GMP
on:
  schedule:
    - cron: "30 2,5,8,12 * * *"   # ~08:00, 11:00, 14:00, 18:00 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths: [build.py, .github/workflows/update.yml]
permissions:
  contents: write
concurrency: update-gmp
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install pytest && python -m pytest -q tests
      - name: Show what the parser sees
        run: python build.py --debug || true
      - run: python build.py
      - name: Commit changes
        run: |
          git config user.name "gmp-bot"
          git config user.email "gmp-bot@users.noreply.github.com"
          git add index.html history.html news.html data
          git diff --cached --quiet || (git commit -m "Update GMP data" && git pull --rebase origin main && git push)
