name: Probe IPO detail pages v2 (temporary)
on:
  push:
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import re, build, details
          _, ipos = build.parse(build.fetch())
          for i in ipos[6:9]:                       # Fusion CX, HD Fire Protect, Shellz: a mix of open and upcoming
              slug = re.search(r"ipowatch\.in/([^/]+)/", i["url"]).group(1)
              stem = slug.split("-ipo")[0]
              cands = [i["url"], f"https://ipowatch.in/{stem}-ipo/"]
              print("=" * 72); print(i["name"], i["status"], "| stem:", stem)
              for u in cands:
                  try: html = build.fetch(u)
                  except Exception as e: print("  ", u, "->", e); continue
                  tables, _ = build.parse(html)
                  d = details.parse_tables(tables)
                  print("  ", u, "| bytes", len(html), "| tables", len(tables), "| details:", [k for k in ("lot","financials","kpi","peers","categories","purposes","promoter") if d.get(k)])
                  for n, t in enumerate(tables):
                      print(f"      table {n}: {len(t)} rows, header={[c[0][:22] for c in t[0]]}")
                      for r in t[1:3]: print("          ", [c[0][:24] for c in r])
              html = build.fetch(i["url"])
              links = sorted({h for h in re.findall(r'href="(https://ipowatch\.in/[^"#]*)"', html) if stem.split("-")[0] in h})
              print("  links on the GMP page that mention the company:", links[:12])
              text = re.sub(r"<script.*?</script>|<style.*?</style>", " ", html, flags=re.S)
              text = re.sub(r"<[^>]+>", " ", text); text = re.sub(r"\s+", " ", text)
              for kw in ("Lot Size", "lot size", "Market Lot", "Revenue", "Peer", "P/E", "ROE"):
                  m = re.search(kw, text)
                  print(f"  [{kw}]", (text[max(0, m.start()-60): m.start()+140] if m else "-- not on page --"))
          PY
