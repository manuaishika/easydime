name: Probe IPO page (temporary)
on:
  push:
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import json, re, urllib.request, build
          d = json.load(open("data/ipos.json"))
          pick = [d[0], next(i for i in d if i["sme"] and i["status"]=="Open"), next(i for i in d if i["status"]=="Closed" and not i["sme"])]
          for i in pick:
              print("=" * 70); print(i["name"], i["url"])
              html = build.fetch(i["url"])
              tables, _ = build.parse(html)
              print("bytes", len(html), "tables", len(tables))
              for n, t in enumerate(tables):
                  print(f"-- table {n}: {len(t)} rows")
                  for r in t[:14]:
                      print("   ", [c[0][:40] for c in r])
              text = re.sub(r"<script.*?</script>|<style.*?</style>", " ", html, flags=re.S)
              text = re.sub(r"<[^>]+>", " ", text); text = re.sub(r"\s+", " ", text)
              for kw in ["Lot Size", "lot size", "Subscription", "GMP History", "GMP Today", "Issue Size", "Retail"]:
                  for m in list(re.finditer(kw, text))[:2]:
                      print(f"[{kw}]", text[max(0, m.start()-60): m.start()+200])
          PY
